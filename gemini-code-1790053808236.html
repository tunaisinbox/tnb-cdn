<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Player</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- UIアイコン用 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="video-container paused" id="videoContainer">
        <!-- 動画要素 -->
        <video id="customVideo" playsinline></video>

        <!-- カスタムUI -->
        <div class="controls" id="videoControls">
            <div class="progress-bar" id="progressBar">
                <div class="progress-filled" id="progressFilled"></div>
            </div>
            
            <div class="controls-main">
                <div class="controls-left">
                    <button class="control-btn" id="playBtn">
                        <i class="fas fa-play"></i>
                    </button>
                    <div class="time-display">
                        <span id="currentTime">00:00</span> / <span id="durationTime">00:00</span>
                    </div>
                </div>

                <div class="controls-right">
                    <div class="volume-container">
                        <button class="control-btn" id="muteBtn">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                    </div>
                    <button class="control-btn" id="fullscreenBtn">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- エラーメッセージ用 -->
        <div id="errorMessage" class="error-message"></div>
    </div>

    <!-- type="module" で分割したJSを読み込む -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
